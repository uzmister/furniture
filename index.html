<!doctype html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8eeff" />
    <title>MONO Mebel — Zamonaviy mebel studiyasi</title>
    <meta
      name="description"
      content="MONO Mebel — zamonaviy, qo'lda yasalgan mebel portfolio. Yumshoq claymorphism dizayni, kun va tun rejimi, to'q ko'k va och ko'k palitra."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MONO Mebel — Zamonaviy mebel studiyasi" />
    <meta
      property="og:description"
      content="Individual loyihalar, yumshoq mebel va oshxona jihozlari. Claymorphism uslubi, kun va tun rejimi."
    />
    <meta property="og:image" content="/img/hero-living-room.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Flash of wrong theme'ni oldini olish uchun temani darhol qo'llaymiz
      (function () {
        try {
          var saved = localStorage.getItem('mono-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
